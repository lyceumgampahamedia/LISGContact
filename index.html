<!-- Add this right before </body> -->
    <script>
        const student = document.querySelector('.student-img');

        // 1. DESKTOP: Track the mouse cursor
        window.addEventListener('mousemove', (e) => {
            // Calculate distance from the center of the screen
            // Dividing by 40 controls the sensitivity (higher number = less movement)
            const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
            
            student.style.transform = `translate(${xAxis}px, ${yAxis}px)`;
        });

        // 2. MOBILE: Track the phone's gyroscope/accelerometer
        window.addEventListener('deviceorientation', (e) => {
            // e.gamma is left-to-right tilt
            // e.beta is front-to-back tilt
            
            // We divide by 2 to dampen the sensitivity so it isn't too erratic
            const xAxis = e.gamma ? e.gamma / 2 : 0; 
            
            // We subtract 45 from beta assuming the user holds the phone at a 45-degree angle
            const yAxis = e.beta ? (e.beta - 45) / 2 : 0; 
            
            student.style.transform = `translate(${xAxis}px, ${yAxis}px)`;
        });
    </script>
</body>
