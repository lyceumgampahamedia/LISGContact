<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll Today</title>
    <link rel="icon" type="image/png" href="TLogo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    
<picture>

        <source srcset="WebBGD-01.jpg" media="(prefers-color-scheme: dark)">

        <img src="WebBG.jpg" class="background-img" alt="Background">
    </picture>

<a href="https://www.lyceum.lk/branches/gampaha/" class="logo" target="_blank">
        <picture>

            <source srcset="Logo-01.png" media="(prefers-color-scheme: dark)">

            <img src="Logo.png" alt="School Logo" style="width: 100%; height: auto; display: block;">
        </picture>
    </a>

    <img src="Student.png" class="student-img" alt="Student">

    <div class="content-overlay">
        
        <div class="text-column">
            <div class="hero-text">
                <h1>Enroll your<br>child today</h1>
                <p>A place to discover their strengths,<br>build lasting friendships, and grow<br>into tomorrow's brightest possibilities.</p>
            </div>
        </div>

        <div class="card-column">
            <div class="card">
                <h2>Contact Us</h2>
                <p>Begin your child's journey with care, curiosity, and confidence.</p>
                
                <div class="button-group">
                    <a href="tel:0334674543" class="btn btn-dark"><i class="fas fa-phone-alt"></i> 033 4 674 543</a>
                    <a href="tel:0334928842" class="btn btn-dark"><i class="fas fa-phone-alt"></i> 033 4 928 842</a>
                    <a href="mailto:lyceum_lg@lyceum.lk" class="btn btn-dark"><i class="fas fa-envelope"></i> Email us</a>
                    
                    <a href="https://maps.app.goo.gl/HtLezLHiW8Vv1WNRA" target="_blank" class="btn btn-light"><i class="fas fa-map-marker-alt"></i> Location</a>
                    <a href="https://www.facebook.com/profile.php?id=100064155962647" target="_blank" class="btn btn-light"><i class="fab fa-facebook-f"></i> Facebook</a>
                    <a href="https://www.instagram.com/lyceumgampaha/" target="_blank" class="btn btn-light"><i class="fab fa-instagram"></i> Instagram</a>
                    <a href="https://www.youtube.com/@LyceumGampaha" target="_blank" class="btn btn-light"><i class="fab fa-youtube"></i> YouTube</a>
                </div>
            </div>
        </div>
        
    </div>
    <script>
        const student = document.querySelector('.student-img');

        window.addEventListener('mousemove', (e) => {

            const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
            
            student.style.transform = `translate(${xAxis}px, ${yAxis}px)`;
        });

        window.addEventListener('deviceorientation', (e) => {

            const xAxis = e.gamma ? e.gamma / 2 : 0; 
            
            const yAxis = e.beta ? (e.beta - 45) / 2 : 0; 
            
            student.style.transform = `translate(${xAxis}px, ${yAxis}px)`;
        });
    </script>
</body>
</html>
</body>
</html>
